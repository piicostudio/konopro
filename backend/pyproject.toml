[project]
name = "konopro-backend"
version = "0.1.0"
description = "Backend API for Konopro concierge MVP ingestion and job tracking."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115",
  "konopro-research",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "sqlmodel>=0.0.22",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]

[project.scripts]
konopro-worker = "konopro_backend.worker:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
konopro-research = { path = "../research", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
